name: daily

# The scheduled pipeline. Replaces the Prefect deployment named in the spec: GitHub Actions cron is
# free and unlimited on a public repo, needs no extra account, and this workflow is one job rather
# than a five-deployment cap. The trade, recorded in AGENTS.md: no retry engine, no run history
# beyond the Actions UI, and no backfill button.
#
# Times are UTC. 03:00 UTC = 04:00 Africa/Lagos.
#
# Measured durations on 2026-11-08, so a regression shows up as a timeout rather than a silent stall:
#   index ~20 s | details (restricted scope) ~45 min | healthplus ~1 min | medplus ~25 min
#   drugstore ~1 min | link + match seconds | refresh seconds
# The GitHub job cap is 6 h; this fits with room, but the FULL Greenbook sweep (~14 h) does not and
# must stay restricted or be sharded across days.

# Three fires, because one `schedule` entry is not a schedule. GitHub's scheduler is best-effort and
# documents that queued runs "may be dropped" under load -- silently, with no run, no log and no
# notification. This repo has had 0 `schedule` events since the file landed on main (2026-11-09), so
# the pipeline cannot depend on the 03:00 fire arriving. Every fire passes the `freshness` job below
# first, so an extra fire costs ~40 s when the day has already run, and the retries exist for the
# night when it has not:
#   03:00  the intended daily time (04:00 Africa/Lagos).
#   04:17  +77 min, so a merely *delayed* 03:00 fire has usually started -- concurrency then makes
#          this fire wait for it instead of overlapping -- and early enough to still finish by day.
#   06:43  +3 h43, for the case where both earlier fires were dropped. A night with no run is not
#          recoverable after the fact, and a fire that skips costs under a minute.
# Neither retry sits on :00 or :30, the minutes GitHub's own docs call the most contended.
on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "17 4 * * *"
    - cron: "43 6 * * *"
  workflow_dispatch:

# Workflow-level, so it serialises the whole run including the gate job: a retry that arrives while
# a pipeline is in progress waits, then asks the database again and finds the day already run.
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cheap gate, before the expensive job. Asks the database -- not the Actions UI, and not
  # v_pipeline_health, which cannot see a source that never ran because zero rows produce no row
  # rather than STALE -- whether today's pipeline has already run. Exits 0 either way and publishes
  # the decision; fails only when it cannot decide.
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.gate.outputs.run }}
      decision: ${{ steps.gate.outputs.decision }}
      missed: ${{ steps.gate.outputs.missed }}
      reason: ${{ steps.gate.outputs.reason }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # psycopg only: the gate must not pay for fastembed and streamlit to answer one question.
      - name: Install psycopg
        run: pip install "psycopg[binary]>=3.2,<3.3"

      # No continue-on-error, deliberately. If the database is unreachable this job fails, which
      # skips the pipeline and goes red: the alternative is to guess "stale" and scrape on top of an
      # unknown state, or guess "fresh" and be green while nobody knows anything.
      - name: Decide whether the day has run
        id: gate
        run: python -X utf8 scripts/freshness_gate.py --event "$GITHUB_EVENT_NAME"

  pipeline:
    needs: freshness
    if: needs.freshness.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300

    # Published for `notify` only. `stock` is the watch's own verdict (`ok`/`alarm`/`undecided`) and
    # `stock_outcome` is the step's pre-continue-on-error outcome (`success`/`failure`), because the
    # step is allowed to fail without failing this job -- see the last step.
    outputs:
      stock: ${{ steps.stock.outputs.signal }}
      stock_detail: ${{ steps.stock.outputs.detail }}
      stock_outcome: ${{ steps.stock.outcome }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The embedding model is ~100 MB and unchanged between runs. Without this cache every run
      # re-downloads it, which is the slowest part of the matcher step.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: fastembed-bge-small-en-v1.5

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Run 2 revealed the secret is set but is not a bare URL: urlsplit found no scheme and put the
      # whole value in the path, which is what happens when the value includes the "DATABASE_URL="
      # key or surrounding quotes. This step normalises it and writes the clean value to
      # GITHUB_ENV so every later step uses it, and warns that it did so.
      - name: Preflight
        env:
          RAW_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -X utf8 - <<'PY'
          import os
          import sys
          import urllib.parse

          try:
              import psycopg
          except Exception as exc:  # noqa: BLE001
              print(f"::error title=import::psycopg failed to import: {exc}")
              sys.exit(1)
          print("psycopg", psycopg.__version__)

          raw = (os.environ.get("RAW_DATABASE_URL") or "").strip()
          if not raw:
              print("::error title=DATABASE_URL::secret is empty or not set. "
                    "Settings > Secrets and variables > Actions > New repository secret.")
              sys.exit(1)

          # Fingerprint that cannot leak the secret: enough to tell a URL apart from a pasted line,
          # a masked placeholder, or something with an invisible leading character.
          import hashlib

          print("raw length", len(raw),
                "| contains ://", "://" in raw,
                "| starts postgres", raw[:10].lower().startswith("postgres"),
                "| first char code", ord(raw[0]),
                "| sha256", hashlib.sha256(raw.encode()).hexdigest()[:12])

          # Tolerate a pasted key name or wrapping quotes, but say so rather than silently fixing it.
          cleaned = raw
          for prefix in ("DATABASE_URL=", "database_url="):
              if cleaned.startswith(prefix):
                  cleaned = cleaned[len(prefix):]
          cleaned = cleaned.strip().strip('"').strip("'").strip()

          if cleaned != raw:
              print("::warning title=DATABASE_URL::secret had a key name or quotes around it; "
                    "normalised. Re-save it as a bare connection URL to silence this.")

          u = urllib.parse.urlsplit(cleaned)
          host = u.hostname or ""
          print("scheme", u.scheme, "| host", host, "| db", (u.path or "").lstrip("/"))
          print("pooler host", "-pooler" in host, "| password present", bool(u.password))

          if u.scheme not in ("postgres", "postgresql") or not u.password or not host:
              print("::error title=DATABASE_URL::not a usable connection URL. It must start with "
                    "the postgresql scheme and contain a user, a password, a host and a dbname.")
              sys.exit(1)
          if "-pooler" in host:
              print("::warning title=poller::pooled host detected; session advisory locks and "
                    "REFRESH ... CONCURRENTLY need the direct host")

          env_file = os.environ.get("GITHUB_ENV")
          if env_file:
              with open(env_file, "a", encoding="utf-8") as handle:
                  handle.write(f"DATABASE_URL={cleaned}\n")
              print("handed the normalised value to later steps")
          PY

      # One failing source must not stop the others: each scraper writes its own `scrape_runs` row,
      # including on failure, and that row is what v_pipeline_health reads. The job still fails at
      # the end if anything failed, so a red run is visible.
      - name: Pipeline
        shell: bash
        run: |
          set -uo pipefail
          FAILED=""

          run_step() {
            local name="$1"; shift
            echo "::group::${name}"
            if "$@"; then
              echo "ok: ${name}"
            else
              echo "::error title=${name}::step failed"
              FAILED="${FAILED} ${name}"
            fi
            echo "::endgroup::"
          }

          py() { python -X utf8 "$@"; }

          # Regulatory half. The index is 6 pages; the detail sweep is the long step.
          run_step "nafdac_index"    py scrapers/nafdac_index.py
          run_step "nafdac_details"  py scrapers/nafdac_details.py --min-similarity 0.50
          run_step "link_product_nrn" py scripts/link_product_nrn.py --refresh --min-similarity 0.35

          # Market half. API-first sources, then the HTML one.
          run_step "healthplus"      py scrapers/healthplus.py
          run_step "medplus"         py scrapers/medplus.py --categories 12,31,32,50,57,58
          run_step "drugstore"       py scrapers/drugstore.py --limit 200

          # Matching is the gate on the headline metric, not the scraping: new listings are
          # worthless to the views until they carry a product_id.
          run_step "match_listings"  py scripts/match_listings.py

          # A stale index is indistinguishable from a quiet market, so the refresh belongs to the
          # flow rather than to a human remembering.
          run_step "refresh_index"   py -c "import os, psycopg; psycopg.connect(os.environ['DATABASE_URL'], autocommit=True).execute('refresh materialized view concurrently mv_drug_price_index')"

          if [ -n "${FAILED}" ]; then
            echo "::error::failed steps:${FAILED}"
            exit 1
          fi
          echo "all steps ok"

      # Archives are dated dumps; they are gitignored and exist so a block costs freshness, not
      # history. Keeping 14 days in Actions is enough to recover from a bad run.
      - name: Keep the archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archives-${{ github.run_id }}
          path: archives/
          if-no-files-found: warn
          retention-days: 14

      - name: Report the ledger
        if: always()
        # Diagnostic only. If it fails it must not add a second red mark on a job that already
        # failed for a real reason.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -X utf8 - <<'PY'
          import os
          import psycopg

          conn = psycopg.connect(os.environ["DATABASE_URL"], autocommit=True)
          rows = conn.execute("""
              select id, source, status, record_count, started_at
              from scrape_runs order by id desc limit 10
          """).fetchall()
          for row in rows:
              print(row)
          PY

      # A source can keep writing rows while losing the only signal that says whether the thing is
      # in stock. On 2026-11-09 MedPlus wrote 128 rows, every one with `in_stock = null`, and
      # nothing complained: the rows landed, `scrape_runs` said success, `v_pipeline_health` said OK.
      # The price view lost 18 entries and two comparisons, and a human found it by eye the next
      # morning. This is the step that complains instead.
      #
      # It is a monitor, so it must never be able to fail the collection: exit 1 means "a source
      # lost its stock signal", and `continue-on-error` turns that into a job output for `notify`
      # rather than a red step -- the job's own conclusion stays `success`. Exit 2 ("cannot decide")
      # is reported the same way and is also not a job failure; the red mark for an unreadable
      # database belongs to the steps that needed one, and this step is read-only and last.
      #
      # `if: always()` because the night worth watching hardest is the night something else broke.
      - name: Watch the stock signal
        id: stock
        if: always()
        continue-on-error: true
        run: python -X utf8 scripts/stock_signal_watch.py

  # Failures and absences both land here, because they are different events with different
  # triggers: a red job needs `if: failure()`, but a dropped fire is an *absence* -- there is no
  # failure to catch, only a gate that noticed the day was unrun and ran it. That is why this job is
  # on `always()` and computes its reason, instead of being keyed on failure.
  notify:
    needs: [freshness, pipeline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-scoped, overriding the workflow's read-only default for this job only. `github.token`
    # is the automatic GITHUB_TOKEN: no new secret, no PAT, nothing to rotate.
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      FRESHNESS_RESULT: ${{ needs.freshness.result }}
      PIPELINE_RESULT: ${{ needs.pipeline.result }}
      # The stock watch runs with continue-on-error, so "a source lost its stock signal" arrives
      # here as an outcome of `failure` on a job whose conclusion is `success`. Both spellings are
      # checked below: the signal when the script decided, the outcome when it could not run.
      STOCK_RESULT: ${{ needs.pipeline.outputs.stock_outcome }}
      STOCK_SIGNAL: ${{ needs.pipeline.outputs.stock }}
      STOCK_DETAIL: ${{ needs.pipeline.outputs.stock_detail }}
      DECISION: ${{ needs.freshness.outputs.decision }}
      MISSED: ${{ needs.freshness.outputs.missed }}
      REASON: ${{ needs.freshness.outputs.reason }}
      EVENT: ${{ github.event_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # One issue per reason, deduplicated by exact title: a week of failures is one issue with
      # seven comments, not seven issues. Nothing is posted when the run is healthy and the day ran.
      - name: Open or update the tracking issue
        shell: bash
        run: |
          set -uo pipefail

          TITLE=""
          if [ "${FRESHNESS_RESULT}" = "failure" ]; then
            TITLE="daily: the freshness gate could not decide"
          elif [ "${PIPELINE_RESULT}" = "failure" ]; then
            TITLE="daily: the pipeline run failed"
          elif [ "${MISSED}" = "true" ]; then
            TITLE="daily: a day passed with no run"
          elif [ "${STOCK_SIGNAL}" = "alarm" ] || [ "${STOCK_RESULT}" = "failure" ]; then
            # Same mechanism as every other reason: one issue per exact title, later occurrences
            # commented. The day is green; a source merely stopped telling us what is in stock.
            TITLE="daily: a source stopped reporting its stock signal"
          fi

          if [ -z "${TITLE}" ]; then
            echo "nothing to report: gate=${DECISION:-none} missed=${MISSED:-false} pipeline=${PIPELINE_RESULT} stock=${STOCK_SIGNAL:-none}"
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "Automated by .github/workflows/daily.yml. One issue per reason; later occurrences are comments here." \
            "" \
            "- gate decision: ${DECISION:-none}" \
            "- freshness job: ${FRESHNESS_RESULT}" \
            "- pipeline job: ${PIPELINE_RESULT}" \
            "- gate detail: ${REASON:-none}" \
            "- trigger: ${EVENT}" \
            "- run: ${RUN_URL}")

          # The watch's own verdict, when it produced one. Appended conditionally so every other
          # reason does not carry a blank line, and so a stock alarm can name the source and the
          # day without a human opening the log.
          if [ -n "${STOCK_DETAIL}" ]; then
            BODY=$(printf '%s\n%s' "${BODY}" "- stock signal: ${STOCK_DETAIL}")
          elif [ "${STOCK_RESULT}" = "failure" ]; then
            BODY=$(printf '%s\n%s' "${BODY}" "- stock signal: the watch step failed before it named a source; see the run log")
          fi

          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)

          if [ -n "${EXISTING}" ]; then
            echo "commenting on issue #${EXISTING}: ${TITLE}"
            gh issue comment "${EXISTING}" --body "${BODY}"
          else
            echo "opening issue: ${TITLE}"
            gh issue create --title "${TITLE}" --body "${BODY}"
          fi
